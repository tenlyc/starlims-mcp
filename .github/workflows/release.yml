name: Release verified Server assets

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) throw new Error('Tag and package version differ')"
      - run: npm run check
      - run: npm run build:devtools-server
      - name: Verify bundled server package
        working-directory: scm/distribution
        run: sha256sum --check SCM_API.sdp.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/starlims-mcp-devtools-server.cjs
            release-assets/starlims-mcp-devtools-server.cjs.sha256
            scm/distribution/SCM_API.sdp
            scm/distribution/SCM_API.sdp.sha256
            scm/distribution/manifest.json
